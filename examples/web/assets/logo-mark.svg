<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="tonMarkTitle tonMarkDesc">
  <!--
    TON mark — curved T (reference lockup)
    Red square + white T deformation:
    - crescent crossbar (umbrella canopy), thick center → sharp tips
    - rice-grain stem (session drop), clear air gap under the arc
    Optical padding tuned for 28px header + 40px mockup sizes.
  -->
  <title id="tonMarkTitle">TON</title>
  <desc id="tonMarkDesc">
    A white curved T on red: arched crescent crossbar over an elongated oval stem.
  </desc>
  <rect width="64" height="64" fill="#BC181E"/>
  <!-- Crescent: outer arch high, inner arch lower → plump center, needle tips -->
  <path
    fill="#FFFFFF"
    d="M9.6 28.4
       C19.4 14.2 44.6 14.2 54.4 28.4
       C42.8 22.2 21.2 22.2 9.6 28.4
       Z"
  />
  <!-- Rice-grain stem; top sits just under crescent for a readable gap at 28px -->
  <ellipse cx="32" cy="42.2" rx="5.8" ry="11.8" fill="#FFFFFF"/>
</svg>
