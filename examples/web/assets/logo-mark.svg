<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="tonMarkTitle tonMarkDesc">
  <!--
    TON mark — curved T (matches logo-mark.png lockup)
    Red field + white crescent canopy + rice-grain stem.
  -->
  <title id="tonMarkTitle">TON</title>
  <desc id="tonMarkDesc">White curved T on red: crescent crossbar over oval stem.</desc>
  <rect width="64" height="64" fill="#BC181E"/>
  <!-- Filled crescent canopy (thick center → sharp tips) -->
  <path
    fill="#FFFFFF"
    d="M14.5 30.5
       C22 16.5 42 16.5 49.5 30.5
       C40.5 23.8 23.5 23.8 14.5 30.5
       Z"
  />
  <!-- Rice-grain stem -->
  <ellipse cx="32" cy="41.5" rx="3.2" ry="11.2" fill="#FFFFFF"/>
</svg>
