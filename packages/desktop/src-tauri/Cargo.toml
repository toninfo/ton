[package]
name = "ton-desktop"
version = "0.0.3"
description = "ton proactive assistant desktop shell"
edition = "2021"
rust-version = "1.90"
publish = false

[[bin]]
name = "ton-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-autostart = "=2.7.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["process", "time", "sync", "macros", "io-util"] }
rand = "=0.8.8"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
